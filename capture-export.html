<!doctype html><meta charset="utf-8"><title>Save design review screenshots</title><label>Screenshot data<textarea id="data"></textarea></label><button id="save">Save screenshots</button><script>document.querySelector('#save').onclick=()=>{const value=document.querySelector('#data').value;JSON.parse(value);const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([value],{type:'application/json'}));a.download='hop-design-v55-captures.json';a.click();document.querySelector('#save').textContent='Saved'}</script>
