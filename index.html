<!doctype html>
<html lang="th">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102e32"><title>DCTT · Pocket Playground</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102e32;color:#fff6df;font-family:Tahoma,sans-serif;overscroll-behavior:none}main{max-width:490px;margin:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));min-height:100svh}header{display:flex;align-items:center;justify-content:space-between}h1{font:900 38px Georgia,serif;letter-spacing:-2px;margin:0;color:#eaff93}small{font-size:10px;letter-spacing:2px;color:#a9c1bd}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.reset{background:transparent;color:#d9e7df;border:1px solid #54716e;padding:10px 14px;border-radius:30px}.stats{display:flex;justify-content:space-between;margin:17px 0 12px;padding:12px 16px;background:#1b3e40;border-radius:16px}.stats span{font-size:11px;color:#a9c1bd}.stats strong{font-size:23px;color:#eaff93;margin-left:5px}.board{position:relative}canvas{display:block;width:100%;aspect-ratio:1;background:#21484a;border-radius:23px;touch-action:none;box-shadow:0 9px 0 #092327}#status{min-height:48px;margin:17px 0 8px;font-size:14px;line-height:1.6;text-align:center}.controls{background:#193a3c;border-radius:20px;padding:14px}.meter{height:9px;background:#092629;border-radius:10px;overflow:hidden;margin:3px 0 12px}.meter i{display:block;height:100%;width:0;background:#edff92;border-radius:10px}#jump{width:100%;border:0;border-radius:15px;background:#eaff93;color:#183b3a;font-weight:bold;font-size:20px;min-height:72px;box-shadow:0 5px 0 #a9bf58;touch-action:none;user-select:none;-webkit-user-select:none}#jump:active{transform:translateY(3px);box-shadow:0 2px 0 #a9bf58}#jump:disabled{opacity:.5}#jump em{display:block;font-size:11px;font-style:normal;font-weight:normal;margin-top:5px}.hint{font-size:12px;line-height:1.8;color:#b7cdc6;text-align:center;margin:14px 5px 0}.tag{display:inline-block;border:1px solid #55716b;border-radius:8px;padding:0 6px;color:#eaff93}footer{font-size:10px;text-align:center;color:#7fa29b;margin-top:15px}button:focus-visible{outline:3px solid #ffbc99;outline-offset:4px}@media(max-height:720px){main{padding-top:10px}h1{font-size:28px}.stats{margin:10px 0;padding:8px 12px}canvas{max-height:44svh;width:auto;max-width:100%;margin:auto}#status{margin:12px 0 4px;min-height:40px}#jump{min-height:57px}.hint{margin-top:10px}}
</style></head>
<body><main><header><div><small>POCKET PLAYGROUND / 01</small><h1>Dancing Tap Tile<span style="color:#ffbc99">.</span></h1></div><button class="reset" id="reset" aria-label="เริ่มเกมใหม่">เริ่มใหม่ ↻</button></header>
<div class="stats"><div><span>คะแนน</span><strong id="score">0</strong></div><div><span>คู่</span><strong id="pairs">0/12</strong></div><div><span>กระโดด</span><strong id="hops">0</strong></div></div>
<div class="board"><canvas id="game" width="500" height="500" aria-label="สนามไทล์ แตะเพื่อเล็งทิศทางกระโดด"></canvas></div>
<p id="status" role="status" aria-live="polite"></p><div class="controls"><div class="meter" role="progressbar" aria-label="แรงกระโดด" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="power"></i></div><button id="jump">กดค้างเพื่อชาร์จ<em>ปล่อยนิ้วเพื่อกระโดด</em></button></div>
<p class="hint"><span class="tag">1</span> แตะไทล์เพื่อเล็ง <span class="tag">2</span> กดปุ่มค้างแล้วปล่อย<br>วงสีเหลืองคือจุดตก • ลงภาพเหมือนกันเพื่อจับคู่<br>ลงผิดภาพจะเปลี่ยนเป้าหมาย • ลงกลางแผ่นได้โบนัส</p><footer>CONCEPT PROTOTYPE · SOLO · 2D JUMP SIMULATION</footer></main>
<script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s), button=$('#jump');
const N=5,CELL=90,OFFSET=25,CHARGE=1200,MIN=24,MAX=570;
const kinds=[{icon:'🍒',name:'เชอร์รี',color:'#ffb6a9'},{icon:'🍋',name:'เลมอน',color:'#f5e49b'},{icon:'🍇',name:'องุ่น',color:'#d9bce6'},{icon:'🥝',name:'กีวี',color:'#c4df9b'}];
let tiles,player,aim,selected,score,pairs,hops,charging=null,flight=null,pointer=null,completed=false,particles=[];
const center=i=>({x:OFFSET+(i%N+.5)*CELL,y:OFFSET+(Math.floor(i/N)+.5)*CELL});
function tileAt(p){const col=Math.floor((p.x-OFFSET)/CELL),row=Math.floor((p.y-OFFSET)/CELL);if(col<0||col>=N||row<0||row>=N)return -1;const i=row*N+col,c=center(i);return Math.abs(c.x-p.x)<=39&&Math.abs(c.y-p.y)<=39?i:-1}
function direction(){let dx=aim.x-player.x,dy=aim.y-player.y,d=Math.hypot(dx,dy);return d<1?{x:0,y:-1}:{x:dx/d,y:dy/d}}
function power(now){return charging===null?0:Math.min(1,Math.max(0,(now-charging)/CHARGE))}
function destination(p){const d=direction(),r=MIN+(MAX-MIN)*p;return {x:player.x+d.x*r,y:player.y+d.y*r}}
function say(t){$('#status').textContent=t}
function hud(){$('#score').textContent=score;$('#pairs').textContent=pairs+'/12';$('#hops').textContent=hops}
function reset(){charging=null;flight=null;pointer=null;completed=false;particles=[];const deck=[];for(let i=0;i<12;i++)deck.push(i%4,i%4);for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}tiles=Array.from({length:25},(_,i)=>i===12?null:deck.pop());player=center(12);aim=center(7);selected=null;score=0;pairs=0;hops=0;button.disabled=false;hud();say('แตะไทล์ที่อยากไป แล้วกดปุ่มค้างเพื่อกระโดดเลือกชิ้นแรก')}
function begin(){if(charging!==null||flight||completed)return;charging=performance.now()}
function cancel(){charging=null;pointer=null}
function launch(){if(charging===null)return;const end=destination(power(performance.now()));charging=null;flight={from:{...player},to:end,start:performance.now(),duration:620};hops++;hud()}
function burst(p){for(let i=0;i<20;i++)particles.push({x:p.x,y:p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,life:1})}
function land(pos){const previous={...player};if(pos.x<20||pos.x>480||pos.y<20||pos.y>480){player=previous;say('ไกลเกินสนาม! กลับจุดเดิม ลองชาร์จให้น้อยลง');return}player=pos;const i=tileAt(pos);if(i<0||tiles[i]===null){say(selected===null?'พื้นว่าง — กระโดดไปเลือกสิ่งของได้เลย':'พื้นว่าง — ยังตามหา '+kinds[tiles[selected]].name+' อยู่');return}if(i===selected){say('แผ่นเดิม! เล็งไปอีกแผ่นที่มีภาพเหมือนกัน');return}const c=center(i),perfect=Math.hypot(pos.x-c.x,pos.y-c.y)<18;if(selected!==null&&tiles[selected]===tiles[i]){tiles[selected]=null;tiles[i]=null;selected=null;pairs++;score+=100+(perfect?25:0);burst(c);say(perfect?'PERFECT! +125 · เลือกคู่ถัดไปได้เลย':'จับคู่สำเร็จ! +100 · เลือกคู่ถัดไปได้เลย');if(pairs===12){completed=true;button.disabled=true;say('เคลียร์สนามแล้ว! '+score+' คะแนน · '+hops+' กระโดด กดเริ่มใหม่เพื่อลองอีกครั้ง')}}else{const changed=selected!==null;selected=i;say((changed?'เปลี่ยนเป้าหมายเป็น ':'เลือกแล้ว: ')+kinds[tiles[i]].name+' — กระโดดหาอีกแผ่นที่เหมือนกัน')}hud()}
canvas.addEventListener('pointerdown',e=>{if(flight||completed)return;const r=canvas.getBoundingClientRect();aim={x:(e.clientX-r.left)*500/r.width,y:(e.clientY-r.top)*500/r.height};e.preventDefault()});
button.addEventListener('pointerdown',e=>{if(e.button!==0||pointer!==null)return;e.preventDefault();pointer=e.pointerId;button.setPointerCapture(pointer);begin()});
button.addEventListener('pointerup',e=>{if(e.pointerId!==pointer)return;pointer=null;launch()});
button.addEventListener('pointercancel',cancel);button.addEventListener('lostpointercapture',()=>{if(pointer!==null)cancel()});
window.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&e.target!==$('#reset')){e.preventDefault();begin()}});window.addEventListener('keyup',e=>{if(e.code==='Space'){e.preventDefault();launch()}});
window.addEventListener('blur',cancel);document.addEventListener('visibilitychange',()=>{if(document.hidden)cancel()});$('#reset').addEventListener('click',reset);
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
let last=performance.now();
function frame(now){const dt=Math.min(3,(now-last)/16.67);last=now;ctx.clearRect(0,0,500,500);ctx.textAlign='center';ctx.textBaseline='middle';for(let i=0;i<25;i++){const c=center(i),k=tiles[i];roundRect(c.x-39,c.y-34,78,78,12,'#123436');roundRect(c.x-39,c.y-40,78,78,12,k===null?'#2d5352':kinds[k].color);if(i===selected){ctx.strokeStyle='#eaff93';ctx.lineWidth=5;ctx.strokeRect(c.x-40,c.y-41,80,80)}if(k!==null){ctx.font='35px "Apple Color Emoji","Segoe UI Emoji",sans-serif';ctx.fillText(kinds[k].icon,c.x,c.y-1)}else if(i===12&&hops===0){ctx.font='10px Tahoma';ctx.fillStyle='#9ebbb0';ctx.fillText('START',c.x,c.y+20)}}
const p=power(now);$('#power').style.width=p*100+'%';$('.meter').setAttribute('aria-valuenow',Math.round(p*100));
if(!flight&&!completed){const target=charging===null?aim:destination(p);ctx.save();ctx.setLineDash([5,7]);ctx.strokeStyle='#ecff96';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x,player.y);ctx.lineTo(target.x,target.y);ctx.stroke();ctx.restore();ctx.strokeStyle=charging===null?'#ffffff88':'#eaff93';ctx.lineWidth=3;ctx.beginPath();ctx.arc(target.x,target.y,charging===null?12:17,0,Math.PI*2);ctx.stroke();if(charging!==null){ctx.fillStyle='#eaff93';ctx.font='bold 13px Tahoma';ctx.fillText(Math.round(p*100)+'%',player.x,player.y-44)}}
let draw=player,height=0;if(flight){const t=Math.min(1,(now-flight.start)/flight.duration);draw={x:flight.from.x+(flight.to.x-flight.from.x)*t,y:flight.from.y+(flight.to.y-flight.from.y)*t};height=Math.sin(t*Math.PI)*65;if(t===1){const end=flight.to;flight=null;land(end);draw=player;height=0}}
ctx.fillStyle='#061f3266';ctx.beginPath();ctx.ellipse(draw.x,draw.y+8,14-height*.07,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff9df';ctx.strokeStyle='#153b3c';ctx.lineWidth=3;ctx.beginPath();ctx.arc(draw.x,draw.y-height-7,14,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#153b3c';ctx.beginPath();ctx.arc(draw.x-4,draw.y-height-9,2,0,Math.PI*2);ctx.arc(draw.x+4,draw.y-height-9,2,0,Math.PI*2);ctx.fill();
particles=particles.filter(a=>a.life>0);for(const a of particles){a.life-=.025*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=.12*dt;ctx.globalAlpha=Math.max(0,a.life);ctx.fillStyle='#ecff96';ctx.fillRect(a.x,a.y,5,5)}ctx.globalAlpha=1;requestAnimationFrame(frame)}
reset();requestAnimationFrame(frame);
</script></body></html>
